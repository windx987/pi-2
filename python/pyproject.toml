[project]
name = "pi2"
version = "0.1.0"
description = "pi/2 in Python: a small coding agent with the same eight steps as Pi, for workshops"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
pi2 = "pi2.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pi2"]
