<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="268" viewBox="0 0 1100 268" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="28" fill="#4b5563" font-size="12" font-weight="700" letter-spacing="0.5">YOU ASK</text>
<text x="390" y="28" fill="#4b5563" font-size="12" font-weight="700" letter-spacing="0.5">THE AGENT CALLS</text>
<text x="750" y="28" fill="#4b5563" font-size="12" font-weight="700" letter-spacing="0.5">YOU SHOULD SEE</text>
<rect x="30" y="44" width="330" height="52" rx="10" fill="#eef3fa" stroke="#2f5a96" stroke-width="1.2"/>
<text x="44" y="66" fill="#1a2b45" font-size="13" font-weight="400" text-anchor="start">Create notes/todo.md with three workshop</text>
<text x="44" y="84" fill="#1a2b45" font-size="13" font-weight="400" text-anchor="start">goals, then read it back.</text>
<rect x="390" y="44" width="330" height="26" rx="7" fill="#edf7f2" stroke="#2f7d5b" stroke-width="1.2"/>
<rect x="395" y="48" width="53.0" height="18" rx="9" fill="#b03a37"/>
<text x="421.5" y="61" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">write</text>
<text x="456.0" y="61.5" fill="#1f2328" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">notes/todo.md</text>
<text x="708" y="62" fill="#2f7d5b" font-size="14" font-weight="700" text-anchor="end">✓</text>
<rect x="390" y="76" width="330" height="26" rx="7" fill="#edf7f2" stroke="#2f7d5b" stroke-width="1.2"/>
<rect x="395" y="80" width="45.6" height="18" rx="9" fill="#b03a37"/>
<text x="417.8" y="93" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">read</text>
<text x="448.6" y="93.5" fill="#1f2328" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">notes/todo.md</text>
<text x="708" y="94" fill="#2f7d5b" font-size="14" font-weight="700" text-anchor="end">✓</text>
<text x="750" y="62" fill="#374151" font-size="13" font-weight="400" text-anchor="start">Wrote N bytes to notes/todo.md, then its</text>
<text x="750" y="80" fill="#374151" font-size="13" font-weight="400" text-anchor="start">content. cat notes/todo.md shows the same.</text>
<line x1="366" y1="60" x2="384" y2="60" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="726" y1="60" x2="742" y2="60" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="30" y1="115" x2="1070" y2="115" stroke="#eef0f3"/>
<rect x="30" y="122" width="330" height="34" rx="10" fill="#eef3fa" stroke="#2f5a96" stroke-width="1.2"/>
<text x="44" y="144" fill="#1a2b45" font-size="13" font-weight="400" text-anchor="start">Write a file to /tmp/outside.txt.</text>
<rect x="390" y="122" width="330" height="26" rx="7" fill="#fbeeee" stroke="#b03a37" stroke-width="1.2"/>
<rect x="395" y="126" width="53.0" height="18" rx="9" fill="#b03a37"/>
<text x="421.5" y="139" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">write</text>
<text x="456.0" y="139.5" fill="#1f2328" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">/tmp/outside.txt</text>
<text x="708" y="140" fill="#b03a37" font-size="14" font-weight="700" text-anchor="end">✗</text>
<text x="750" y="140" fill="#374151" font-size="13" font-weight="400" text-anchor="start">Refusing to write outside the working</text>
<text x="750" y="158" fill="#374151" font-size="13" font-weight="400" text-anchor="start">directory. The file does not exist; the agent</text>
<text x="750" y="176" fill="#374151" font-size="13" font-weight="400" text-anchor="start">explains.</text>
<line x1="366" y1="138" x2="384" y2="138" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="726" y1="138" x2="742" y2="138" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="30" y1="193" x2="1070" y2="193" stroke="#eef0f3"/>
<rect x="30" y="206" width="1040" height="42" rx="10" fill="#fdf6e7" stroke="#b7791f" stroke-width="1.5"/>
<text x="48" y="232" fill="#b7791f" font-size="12" font-weight="700" letter-spacing="0.6">HINT</text>
<text x="96" y="232" fill="#4a3510" font-size="13" font-weight="400" text-anchor="start">The model does not see the file it wrote unless it reads it: your short confirmation is all it gets, so say what happened and where.</text>
</svg>
