<text x="417.8" y="455" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">read</text>
<text x="448.6" y="455.5" fill="#1f2328" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">…  reads</text>
<text x="708" y="456" fill="#2f7d5b" font-size="14" font-weight="700" text-anchor="end">✓</text>
<text x="750" y="392" fill="#374151" font-size="13" font-weight="400" text-anchor="start">Context is filling up: summarizing older</text>
<text x="750" y="410" fill="#374151" font-size="13" font-weight="400" text-anchor="start">messages..., another Compacted box, and the</text>
<text x="750" y="428" fill="#374151" font-size="13" font-weight="400" text-anchor="start">agent reads on.</text>
