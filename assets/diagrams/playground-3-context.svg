<text x="44" y="300" fill="#2f5a96" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">/compact keep the yes or no</text>
<text x="44" y="318" fill="#2f5a96" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">line of every report</text>
<text x="394" y="300" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start">no tool call: a pi2 command</text>
<text x="750" y="296" fill="#374151" font-size="13" font-weight="400" text-anchor="start">Compacted N messages, with the tokens before</text>
<text x="750" y="314" fill="#374151" font-size="13" font-weight="400" text-anchor="start">and after, and the start of the summary. The</text>
<text x="750" y="332" fill="#374151" font-size="13" font-weight="400" text-anchor="start">newest 4k stay word for word.</text>
