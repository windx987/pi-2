<line x1="30" y1="367" x2="1070" y2="367" stroke="#eef0f3"/>
<rect x="30" y="374" width="330" height="52" rx="10" fill="#eef3fa" stroke="#2f5a96" stroke-width="1.2"/>
<text x="44" y="396" fill="#1a2b45" font-size="13" font-weight="400" text-anchor="start">Read INC-2609.md to INC-2630.md the same</text>
<text x="44" y="414" fill="#1a2b45" font-size="13" font-weight="400" text-anchor="start">way.</text>
