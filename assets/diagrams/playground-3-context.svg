<line x1="726" y1="500" x2="742" y2="500" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="30" y1="573" x2="1070" y2="573" stroke="#eef0f3"/>
<text x="30" y="590" fill="#4b5563" font-size="12" font-weight="400" text-anchor="start">The bars show the context after each step; the dashed mark is where automatic compaction starts (16k of 32k).</text>
<rect x="30" y="608" width="1040" height="62" rx="10" fill="#fdf6e7" stroke="#b7791f" stroke-width="1.5"/>
<text x="48" y="634" fill="#b7791f" font-size="12" font-weight="700" letter-spacing="0.6">HINT</text>
<text x="96" y="634" fill="#4a3510" font-size="13" font-weight="400" text-anchor="start">The parts in /context are estimates, scaled to the model's last count. A summary keeps what it is asked to keep: say it in /compact's focus. Compare</text>
<text x="96" y="654" fill="#4a3510" font-size="13" font-weight="400" text-anchor="start">the final yes lines with scenario 2, where the parent never held the reports.</text>
