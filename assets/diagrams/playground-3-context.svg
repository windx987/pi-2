<text x="750" y="502" fill="#374151" font-size="13" font-weight="400" text-anchor="start">New session started, and the context is empty</text>
<text x="750" y="520" fill="#374151" font-size="13" font-weight="400" text-anchor="start">again. Ask what it found: it does not know,</text>
<text x="750" y="538" fill="#374151" font-size="13" font-weight="400" text-anchor="start">and reads the reports again.</text>
<rect x="750" y="550" width="310" height="8" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
<rect x="750" y="550" width="6.622314453125" height="8" rx="4" fill="#2f7d5b" opacity="0.8"/>
