<text x="750" y="62" fill="#374151" font-size="13" font-weight="400" text-anchor="start">The system prompt and one tool: under 1k of</text>
<text x="750" y="80" fill="#374151" font-size="13" font-weight="400" text-anchor="start">33k.</text>
