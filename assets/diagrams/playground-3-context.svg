<text x="750" y="218" fill="#374151" font-size="13" font-weight="400" text-anchor="start">Tool results are most of it, 7k to 10k: a</text>
<text x="750" y="236" fill="#374151" font-size="13" font-weight="400" text-anchor="start">small model sometimes reads a file twice.</text>
<rect x="750" y="248" width="310" height="8" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
<rect x="750" y="248" width="85.14404296875" height="8" rx="4" fill="#2f7d5b" opacity="0.8"/>
