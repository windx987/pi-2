<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="850" height="572" viewBox="0 0 850 572" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="42"><tspan fill="#9aa7b8"></tspan><tspan fill="#1a2b45" font-weight="600">pi-2/ (python branch)</tspan></text><text x="301.7" y="42" fill="#1a2b45">Lobotomized: pi/2 in Python</text>
<text x="24" y="66"><tspan fill="#9aa7b8">├── </tspan><tspan fill="#2f5a96" font-weight="600">pi2/</tspan></text><text x="301.7" y="66" fill="#1a2b45">the agent, one file per step</text>
<text x="24" y="90"><tspan fill="#9aa7b8">│   ├── </tspan><tspan fill="#2f5a96" font-weight="600">cli.py</tspan></text><text x="301.7" y="90" fill="#1a2b45">options, loads extensions (-e)</text>
<text x="24" y="114"><tspan fill="#9aa7b8">│   ├── </tspan><tspan fill="#2f5a96" font-weight="600">tui.py</tspan></text><text x="301.7" y="114" fill="#1a2b45">1 · interactive mode: editor, footer, tool boxes</text>
<text x="24" y="138"><tspan fill="#9aa7b8">│   ├── </tspan><tspan fill="#2f5a96" font-weight="600">session.py</tspan></text><text x="301.7" y="138" fill="#1a2b45">2 · AgentSession; 8 · saves messages</text>
<text x="24" y="162"><tspan fill="#9aa7b8">│   ├── </tspan><tspan fill="#2f5a96" font-weight="600">agent_loop.py</tspan></text><text x="301.7" y="162" fill="#1a2b45">3 · ask, run tool calls, repeat (6, 7, 8)</text>
<text x="24" y="186"><tspan fill="#9aa7b8">│   ├── </tspan><tspan fill="#2f5a96" font-weight="600">model_runtime.py</tspan></text><text x="301.7" y="186" fill="#1a2b45">4 · models.json, API key, stream_fn</text>
<text x="24" y="210"><tspan fill="#9aa7b8">│   ├── </tspan><tspan fill="#2f5a96" font-weight="600">ai.py</tspan></text><text x="301.7" y="210" fill="#1a2b45">5 · OpenAI-compatible streaming provider</text>
<text x="24" y="234"><tspan fill="#9aa7b8">│   ├── </tspan><tspan fill="#2f5a96" font-weight="600">schema.py</tspan></text><text x="301.7" y="234" fill="#1a2b45">6 · checks tool arguments</text>
<text x="24" y="258"><tspan fill="#9aa7b8">│   ├── </tspan><tspan fill="#2f5a96" font-weight="600">compaction.py</tspan></text><text x="301.7" y="258" fill="#1a2b45">summarizes old messages when the context fills up</text>
<text x="24" y="282"><tspan fill="#9aa7b8">│   └── </tspan><tspan fill="#2f5a96" font-weight="600">extensions.py</tspan></text><text x="301.7" y="282" fill="#1a2b45">define_tool, ExtensionAPI, loads -e files</text>
<text x="24" y="306"><tspan fill="#9aa7b8">├── </tspan><tspan fill="#b03a37" font-weight="600">exercises/</tspan></text><text x="301.7" y="306" fill="#4a1a18">your extensions, each with a README</text>
<text x="24" y="330"><tspan fill="#9aa7b8">│   ├── </tspan><tspan fill="#b03a37" font-weight="600">01-read/ … 04-edit/</tspan></text><text x="301.7" y="330" fill="#4a1a18">you implement execute() in starter.py</text>
<text x="24" y="354"><tspan fill="#9aa7b8">│   └── </tspan><tspan fill="#b03a37" font-weight="600">05-subagent/</tspan></text><text x="301.7" y="354" fill="#4a1a18">a tool that runs a second agent</text>
<text x="24" y="378"><tspan fill="#9aa7b8">├── </tspan><tspan fill="#b03a37" font-weight="600">examples/</tspan></text><text x="301.7" y="378" fill="#4a1a18">hello.py (a tool), permission_gate.py (a listener)</text>
<text x="24" y="402"><tspan fill="#9aa7b8">├── </tspan><tspan fill="#b03a37" font-weight="600">playground/</tspan></text><text x="301.7" y="402" fill="#4a1a18">the small project the agent works on (copy it)</text>
<text x="24" y="426"><tspan fill="#9aa7b8">├── </tspan><tspan fill="#b03a37" font-weight="600">pi2.sh</tspan></text><text x="301.7" y="426" fill="#4a1a18">starts Lobotomized from the clone</text>
<text x="24" y="450"><tspan fill="#9aa7b8">├── </tspan><tspan fill="#6b7280" font-weight="600">tests/</tspan></text><text x="301.7" y="450" fill="#6b7280">unit tests, no model needed</text>
<text x="24" y="474"><tspan fill="#9aa7b8">├── </tspan><tspan fill="#6b7280" font-weight="600">pyproject.toml</tspan></text><text x="301.7" y="474" fill="#6b7280">pip install -e . gives a pi2 command</text>
<text x="24" y="498"><tspan fill="#9aa7b8">└── </tspan><tspan fill="#6b7280" font-weight="600">assets/</tspan></text><text x="301.7" y="498" fill="#6b7280">logo and diagrams</text>
<line x1="24" y1="512" x2="826" y2="512" stroke="#e5e7eb"/>
<rect x="24" y="524" width="12" height="12" rx="2" fill="#b03a37"/><text x="42" y="535" fill="#4b5563">workshop: where you work</text>
<rect x="288.4" y="524" width="12" height="12" rx="2" fill="#2f5a96"/><text x="306.4" y="535" fill="#4b5563">core: read this code</text>
<rect x="516.4" y="524" width="12" height="12" rx="2" fill="#6b7280"/><text x="534.4" y="535" fill="#4b5563">other: outside the workshop path</text>
</svg>
