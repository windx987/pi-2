<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="482" viewBox="0 0 1100 482" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="28" fill="#4b5563" font-size="12" font-weight="700" letter-spacing="0.5">WHAT THE AGENT DOES</text>
<rect x="30.0" y="42" width="240.5" height="84" rx="10" fill="#f3effa" stroke="#6d4bb3" stroke-width="1.5"/>
<rect x="42.0" y="54" width="80" height="20" rx="10" fill="#6d4bb3"/>
<text x="82.0" y="68" fill="#fff" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">subagent</text>
<text x="42.0" y="95" fill="#1f2328" font-size="14" font-weight="700" text-anchor="start">Split the work</text>
<text x="42.0" y="114" fill="#4b5563" font-size="12" font-weight="400" text-anchor="start">three tasks of 10 reports</text>
<rect x="296.5" y="42" width="240.5" height="84" rx="10" fill="#fbeeee" stroke="#b03a37" stroke-width="1.5"/>
<rect x="308.5" y="54" width="48" height="20" rx="10" fill="#b03a37"/>
<text x="332.5" y="68" fill="#fff" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">read</text>
<text x="308.5" y="95" fill="#1f2328" font-size="14" font-weight="700" text-anchor="start">Each reads 10</text>
<text x="308.5" y="114" fill="#4b5563" font-size="12" font-weight="400" text-anchor="start">in its own, empty context</text>
<line x1="273.5" y1="84" x2="293.5" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="563.0" y="42" width="240.5" height="84" rx="10" fill="#eef3fa" stroke="#2f5a96" stroke-width="1.5"/>
<text x="575.0" y="95" fill="#1f2328" font-size="14" font-weight="700" text-anchor="start">Each answers</text>
<text x="575.0" y="114" fill="#4b5563" font-size="12" font-weight="400" text-anchor="start">a short list: number, date, cause</text>
<line x1="540.0" y1="84" x2="560.0" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="829.5" y="42" width="240.5" height="84" rx="10" fill="#eef3fa" stroke="#2f5a96" stroke-width="1.5"/>
<text x="841.5" y="95" fill="#1f2328" font-size="14" font-weight="700" text-anchor="start">Parent combines</text>
<text x="841.5" y="114" fill="#4b5563" font-size="12" font-weight="400" text-anchor="start">three lists into one answer</text>
<line x1="806.5" y1="84" x2="826.5" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="30" y="168" fill="#4b5563" font-size="12" font-weight="700" letter-spacing="0.5">30 REPORTS, ABOUT 25K TOKENS</text>
<rect x="30" y="180" width="160" height="96" rx="8" fill="#f3effa" stroke="#6d4bb3" stroke-width="1.2"/>
<path d="M 42 192 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<path d="M 70 192 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<path d="M 98 192 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<path d="M 126 192 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<path d="M 154 192 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<path d="M 42 222 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<path d="M 70 222 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<path d="M 98 222 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<path d="M 126 222 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<path d="M 154 222 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<text x="110" y="268" fill="#6d4bb3" font-size="11" font-weight="400" text-anchor="middle">subagent 1: INC-2601–2610</text>
<line x1="110" y1="278" x2="270" y2="318" stroke="#6d4bb3" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="202" y="180" width="160" height="96" rx="8" fill="#f3effa" stroke="#6d4bb3" stroke-width="1.2"/>
<path d="M 214 192 h 16 l 6 6 v 18 h -22 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
