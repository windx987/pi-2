<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="378" viewBox="0 0 1100 378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="28" fill="#4b5563" font-size="12" font-weight="700" letter-spacing="0.5">YOU ASK</text>
<text x="390" y="28" fill="#4b5563" font-size="12" font-weight="700" letter-spacing="0.5">THE AGENT CALLS</text>
<text x="750" y="28" fill="#4b5563" font-size="12" font-weight="700" letter-spacing="0.5">YOU SHOULD SEE</text>
<rect x="30" y="44" width="330" height="34" rx="10" fill="#eef3fa" stroke="#2f5a96" stroke-width="1.2"/>
<text x="44" y="66" fill="#1a2b45" font-size="13" font-weight="400" text-anchor="start">Run the tests.</text>
<rect x="390" y="44" width="330" height="26" rx="7" fill="#fbeeee" stroke="#b03a37" stroke-width="1.2"/>
<rect x="395" y="48" width="45.6" height="18" rx="9" fill="#b03a37"/>
<text x="417.8" y="61" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">bash</text>
<text x="448.6" y="61.5" fill="#1f2328" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">npm test</text>
<text x="708" y="62" fill="#b03a37" font-size="14" font-weight="700" text-anchor="end">✗</text>
<text x="750" y="62" fill="#374151" font-size="13" font-weight="400" text-anchor="start">The test output with one failing test, and</text>
<text x="750" y="80" fill="#374151" font-size="13" font-weight="400" text-anchor="start">exit code 1: a red result the model reads.</text>
<line x1="366" y1="60" x2="384" y2="60" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="726" y1="60" x2="742" y2="60" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="30" y1="97" x2="1070" y2="97" stroke="#eef0f3"/>
<rect x="30" y="104" width="330" height="34" rx="10" fill="#eef3fa" stroke="#2f5a96" stroke-width="1.2"/>
<text x="44" y="126" fill="#1a2b45" font-size="13" font-weight="400" text-anchor="start">Why does the test fail?</text>
<rect x="390" y="104" width="330" height="26" rx="7" fill="#edf7f2" stroke="#2f7d5b" stroke-width="1.2"/>
<rect x="395" y="108" width="45.6" height="18" rx="9" fill="#b03a37"/>
<text x="417.8" y="121" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">read</text>
<text x="448.6" y="121.5" fill="#1f2328" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">math.js</text>
<text x="708" y="122" fill="#2f7d5b" font-size="14" font-weight="700" text-anchor="end">✓</text>
<rect x="390" y="136" width="330" height="26" rx="7" fill="#edf7f2" stroke="#2f7d5b" stroke-width="1.2"/>
<rect x="395" y="140" width="45.6" height="18" rx="9" fill="#b03a37"/>
<text x="417.8" y="153" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">read</text>
<text x="448.6" y="153.5" fill="#1f2328" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">math.test.js</text>
<text x="708" y="154" fill="#2f7d5b" font-size="14" font-weight="700" text-anchor="end">✓</text>
<text x="750" y="122" fill="#374151" font-size="13" font-weight="400" text-anchor="start">The agent explains: average() divides by</text>
<text x="750" y="140" fill="#374151" font-size="13" font-weight="400" text-anchor="start">values.length - 1. Fixing it is exercise 04.</text>
<line x1="366" y1="120" x2="384" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="726" y1="120" x2="742" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="30" y1="175" x2="1070" y2="175" stroke="#eef0f3"/>
<rect x="30" y="182" width="330" height="34" rx="10" fill="#eef3fa" stroke="#2f5a96" stroke-width="1.2"/>
<text x="44" y="204" fill="#1a2b45" font-size="13" font-weight="400" text-anchor="start">Run sleep 30 with a 2 second timeout.</text>
<rect x="390" y="182" width="330" height="26" rx="7" fill="#fbeeee" stroke="#b03a37" stroke-width="1.2"/>
<rect x="395" y="186" width="45.6" height="18" rx="9" fill="#b03a37"/>
<text x="417.8" y="199" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">bash</text>
<text x="448.6" y="199.5" fill="#1f2328" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">sleep 30  timeout 2</text>
<text x="708" y="200" fill="#b03a37" font-size="14" font-weight="700" text-anchor="end">✗</text>
<text x="750" y="200" fill="#374151" font-size="13" font-weight="400" text-anchor="start">Command stopped after 2 seconds. docker ps</text>
<text x="750" y="218" fill="#374151" font-size="13" font-weight="400" text-anchor="start">shows no container left.</text>
<line x1="366" y1="198" x2="384" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="726" y1="198" x2="742" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="30" y1="235" x2="1070" y2="235" stroke="#eef0f3"/>
<rect x="30" y="242" width="330" height="34" rx="10" fill="#eef3fa" stroke="#2f5a96" stroke-width="1.2"/>
<text x="44" y="264" fill="#1a2b45" font-size="13" font-weight="400" text-anchor="start">Run getent hosts example.com.</text>
<rect x="390" y="242" width="330" height="26" rx="7" fill="#fbeeee" stroke="#b03a37" stroke-width="1.2"/>
<rect x="395" y="246" width="45.6" height="18" rx="9" fill="#b03a37"/>
<text x="417.8" y="259" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">bash</text>
<text x="448.6" y="259.5" fill="#1f2328" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">getent hosts example.com</text>
<text x="708" y="260" fill="#b03a37" font-size="14" font-weight="700" text-anchor="end">✗</text>
<text x="750" y="260" fill="#374151" font-size="13" font-weight="400" text-anchor="start">It fails: the container has no network.</text>
<line x1="366" y1="258" x2="384" y2="258" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="726" y1="258" x2="742" y2="258" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="30" y1="283" x2="1070" y2="283" stroke="#eef0f3"/>
<rect x="30" y="296" width="1040" height="62" rx="10" fill="#fdf6e7" stroke="#b7791f" stroke-width="1.5"/>
<text x="48" y="322" fill="#b7791f" font-size="12" font-weight="700" letter-spacing="0.6">HINT</text>
<text x="96" y="322" fill="#4a3510" font-size="13" font-weight="400" text-anchor="start">Start Docker first (Docker Desktop, or colima start) and keep the playground copy under your home directory: Docker shares only that with its</text>
<text x="96" y="342" fill="#4a3510" font-size="13" font-weight="400" text-anchor="start">containers. ctrl+c stops a running command.</text>
</svg>
